# Existing files win over these rules. /assets/* only 404s when the file is gone.
[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404
  force = false
  [redirects.headers]
    Cache-Control = "no-store"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/404.html"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/status.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
